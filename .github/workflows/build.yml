name: Build and Test Wander

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"

  pull_request:

permissions:
  contents: read
  packages: write

env:
  GRADLE_USER_HOME: ${{ github.workspace }}/.gradle
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"
  DS_DISABLED_RESOLUTION_JOBS: "gradle"

  GHCR_IMAGE: ghcr.io/vahdamv0/wander

jobs:

  # ============================================================
  # Test
  # ============================================================
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Gradle and Node
        uses: actions/cache@v5
        with:
          path: |
            .gradle/caches
            .gradle/wrapper
            web/node_modules
          key: ${{ runner.os }}-wander-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'web/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-wander-

      - name: Run build and tests
        run: ./gradlew build

      - name: Generate Gradle dependency report
        run: ./gradlew dependencies > gradle.graph.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: api/build/test-results/test/TEST-*.xml
          if-no-files-found: warn
          retention-days: 7

      - name: Upload OpenAPI specification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: api/build/openapi.json
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Gradle dependency report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-dependencies
          path: gradle.graph.txt
          if-no-files-found: warn
          retention-days: 7


  # ============================================================
  # API client drift
  # ============================================================
  api-client-drift:
    name: API Client Drift
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Gradle and Node
        uses: actions/cache@v5
        with:
          path: |
            .gradle/caches
            .gradle/wrapper
            web/node_modules
          key: ${{ runner.os }}-wander-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'web/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-wander-

      # The OpenAPI specification is generated by this test.
      - name: Generate OpenAPI specification
        run: ./gradlew :api:test

      # Capture the committed client.
      - name: Hash committed API client
        run: |
          find web/src/app/api -type f -print0 \
            | sort -z \
            | xargs -0 sha256sum > /tmp/api-client.before

      # Force regeneration.
      - name: Regenerate API client
        run: ./gradlew :web:apiGen --rerun

      # Capture the generated client.
      - name: Hash generated API client
        run: |
          find web/src/app/api -type f -print0 \
            | sort -z \
            | xargs -0 sha256sum > /tmp/api-client.after

      - name: Check API client drift
        shell: bash
        run: |
          set +e

          diff -u \
            /tmp/api-client.before \
            /tmp/api-client.after \
            > /tmp/api-client.diff

          RESULT=$?

          case "$RESULT" in
            0)
              echo "The committed API client matches the spec."
              exit 0
              ;;

            1)
              echo "The committed API client is out of date."
              echo "Run './gradlew :api:test :web:apiGen' and commit web/src/app/api."
              echo
              cat /tmp/api-client.diff
              exit 1
              ;;

            *)
              echo "The drift check could not run."
              echo "This is a CI fault, not API client drift."
              exit 2
              ;;
          esac


  # ============================================================
  # Container image
  # ============================================================
  container-image:
    name: Build Container Image

    # Do not build the container until ALL verification jobs pass.
    needs:
      - test
      - api-client-drift

    runs-on: ubuntu-latest

    # Only build/publish images for:
    #
    #   - the default branch
    #   - version tags
    #
    # Pull requests and other branches run verification only.
    if: |
      github.event_name == 'push' &&
      (
        github.ref == format('refs/heads/{0}', github.event.repository.default_branch) ||
        startsWith(github.ref, 'refs/tags/')
      )

    steps:

      - name: Checkout
        uses: actions/checkout@v7

      # ----------------------------------------------------------
      # Multi-platform build support
      # ----------------------------------------------------------

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # ----------------------------------------------------------
      # GitHub Container Registry
      # ----------------------------------------------------------

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ----------------------------------------------------------
      # Determine image tags
      # ----------------------------------------------------------

      - name: Determine image tags
        id: meta
        shell: bash
        run: |
          TAGS=""

          # Always publish latest.
          TAGS="${TAGS} --tag ${GHCR_IMAGE}:latest"

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then

            TAG="${GITHUB_REF_NAME}"

            TAGS="${TAGS} --tag ${GHCR_IMAGE}:${TAG}"

            VERSION="${TAG#v}"

            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "image=${GHCR_IMAGE}:${TAG}" >> "$GITHUB_OUTPUT"

          else

            TAG="${GITHUB_SHA::7}"

            TAGS="${TAGS} --tag ${GHCR_IMAGE}:${TAG}"

            echo "version=" >> "$GITHUB_OUTPUT"
            echo "image=${GHCR_IMAGE}:${TAG}" >> "$GITHUB_OUTPUT"

          fi

          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

          echo "Image tags:"
          echo "${TAGS}"

      # ----------------------------------------------------------
      # Build and publish
      # ----------------------------------------------------------

      - name: Build and push multi-platform image
        shell: bash
        run: |
          VERSION_ARG=""

          if [ -n "${{ steps.meta.outputs.version }}" ]; then
            VERSION_ARG="--build-arg WANDER_VERSION=${{ steps.meta.outputs.version }}"
          fi

          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --provenance=false \
            --sbom=false \
            --build-arg WANDER_BUILD_REF="${GITHUB_SHA::7}" \
            ${VERSION_ARG} \
            ${{ steps.meta.outputs.tags }} \
            --push .

          echo "${{ steps.meta.outputs.image }}" > image-ref.txt

      # ----------------------------------------------------------
      # Save image reference
      # ----------------------------------------------------------

      - name: Upload image reference
        uses: actions/upload-artifact@v4
        with:
          name: image-reference
          path: image-ref.txt
          retention-days: 7

      # ----------------------------------------------------------
      # Validate published image
      # ----------------------------------------------------------

      - name: Pull published image
        shell: bash
        run: |
          IMAGE_REF="${{ steps.meta.outputs.image }}"
          docker pull "$IMAGE_REF"

      - name: Extract deployment bundle
        shell: bash
        run: |
          IMAGE_REF="${{ steps.meta.outputs.image }}"

          mkdir -p /tmp/bundle

          docker run --rm "$IMAGE_REF" bundle \
            | tar x -C /tmp/bundle

      - name: Validate deployment bundle
        shell: bash
        run: |
          test -f /tmp/bundle/compose.yaml
          test -f /tmp/bundle/Caddyfile
          test -f /tmp/bundle/.env.example
          test -x /tmp/bundle/update.sh
          test -f /tmp/bundle/backup/backup.sh
          test -f /tmp/bundle/monitoring/config.alloy
          test -f /tmp/bundle/monitoring/wander-countries.json
          test -x /tmp/bundle/monitoring/geoip-update.sh

          echo "Deployment bundle validation passed."
