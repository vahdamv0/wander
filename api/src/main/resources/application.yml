spring:
  application:
    name: wander

  servlet:
    multipart:
      # The one limit that matters for booking import: an uploaded confirmation
      # is an email or a PDF, and both are small. This is what stops a large
      # upload becoming a large byte[] in the heap before anything has looked at
      # it — the extractor's own timeout and output cap are downstream of here.
      max-file-size: ${WANDER_IMPORT_MAX_FILE_SIZE:5MB}
      max-request-size: ${WANDER_IMPORT_MAX_REQUEST_SIZE:6MB}

  # Credentials for whatever relay the operator chose. Spring's own properties
  # rather than repeated under `wander`: every provider speaks SMTP, so there is
  # one shape to configure and no vendor named anywhere in this project. Brevo,
  # Gmail, Resend or a Postfix on the next rack are the same four lines in .env.
  #
  # host is blank by default, and that is load-bearing: with no host there is no
  # JavaMailSender bean at all, which is why SmtpMailClient takes it as an
  # ObjectProvider instead of injecting it. Injecting it directly would fail the
  # context on every instance that does not send mail — which is most of them.
  mail:
    host: ${WANDER_SMTP_HOST:}
    port: ${WANDER_SMTP_PORT:587}
    username: ${WANDER_SMTP_USER:}
    password: ${WANDER_SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${WANDER_SMTP_AUTH:true}
          starttls:
            enable: ${WANDER_SMTP_STARTTLS:true}
          # A stalled relay must not hold a request thread open: the endpoint
          # answers 204 whatever happens, so a slow send would become a slow page
          # for somebody who is only being told to check their mail.
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

  datasource:
    url: ${WANDER_DB_URL:jdbc:postgresql://localhost:5432/wander}
    username: ${WANDER_DB_USER:wander}
    password: ${WANDER_DB_PASSWORD:wander}

  jpa:
    # Flyway owns the schema. `validate` means a drifted entity fails at boot
    # instead of silently altering tables under a running instance.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  # Sessions in Postgres, not in Tomcat's heap. The session *is* the credential
  # in this application — an httpOnly cookie, no tokens — so an in-memory store
  # means every restart signs out every user, and live sync comes back from a
  # deploy asking people to log in again.
  session:
    store-type: jdbc
    # Matches server.servlet.session.timeout below; set explicitly because with
    # Spring Session on the classpath this property is the one that wins.
    timeout: 30d
    jdbc:
      # Flyway owns the schema (V5). Letting Spring Session create its own tables
      # would leave two things believing they own the same two tables.
      initialize-schema: never

  # An SPA route like /trips/7 is not a static file; the SPA fallback below
  # turns it back into index.html.
  web:
    resources:
      add-mappings: true

  threads:
    virtual:
      # Virtual threads make plain blocking JDBC code cheap to scale, which is
      # why none of this project needs to be reactive.
      enabled: true

server:
  port: ${WANDER_PORT:8080}
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        # Set WANDER_COOKIE_SECURE=true behind TLS (i.e. always, in production).
        secure: ${WANDER_COOKIE_SECURE:false}
      # Read by Spring Session too, but spring.session.timeout is what decides;
      # kept in step with it.
      timeout: 30d
  forward-headers-strategy: framework

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  # Without these, springdoc documents every response as `*/*` (no controller
  # declares `produces`), and ng-openapi-gen then generates a client that asks
  # for a Blob instead of JSON. The server is fine either way — curl sees proper
  # JSON — so this only ever shows up in the browser, as a body that arrives
  # unparsed.
  default-produces-media-type: application/json
  default-consumes-media-type: application/json

wander:
  # "dev" unless this image was built from a release tag, which is the only thing
  # that makes a version mean anything. See the Dockerfile's build arguments.
  version: ${WANDER_VERSION:dev}
  # The commit CI built. Empty anywhere else, and empty is shown as nothing.
  build-ref: ${WANDER_BUILD_REF:}
  # Where the source for THIS instance lives, linked from the sign-in page and
  # the account menu. AGPL-3.0 section 13: an instance offered to others over a
  # network owes its users the source of the version it is running. If you
  # modify wander, point this at your fork — a link to upstream would name code
  # your instance is not running.
  source-url: ${WANDER_SOURCE_URL:https://github.com/vahdamv0/wander}

  # Sending mail. Off by default, and the default is the point: this is the only
  # upstream in wander with no working public option — Nominatim, Open-Meteo and
  # the tiles all have one — so an operator has to go and get an SMTP relay
  # before it can do anything. With it off, "Forgot password?" is not offered and
  # /api/auth/reset/request answers 404; an administrator minting a link by hand
  # remains the recovery route, exactly as it was.
  mail:
    enabled: ${WANDER_MAIL_ENABLED:false}
    # The envelope sender. It must be an address the relay is authorised to send
    # for, or the message is signed by one domain while claiming to come from
    # another — the pattern spam filters exist to catch, and a reset link in a
    # junk folder is indistinguishable from one that was never sent.
    from: ${WANDER_MAIL_FROM:}
    from-name: ${WANDER_MAIL_FROM_NAME:wander}
    # Blank derives the link from the request, which is right behind a proxy that
    # sets the forwarded headers. Set it when the links come out wrong.
    base-url: ${WANDER_MAIL_BASE_URL:}
    reset-expires-minutes: ${WANDER_MAIL_RESET_EXPIRES_MINUTES:60}
    max-requests-per-address: ${WANDER_MAIL_MAX_REQUESTS_PER_ADDRESS:5}
  # A worked example trip and a read-only account to look at it with. Off by
  # default because it writes rows — this is for a public demo box, not for
  # somebody's real instance. It re-seeds on every boot (only within its own
  # trips), which is what keeps the dates inside the forecast horizon and what
  # tidies up after visitors. The password is meant to be published: the
  # sign-in page prints it, and the account is a viewer on that one trip.
  demo:
    enabled: ${WANDER_DEMO_ENABLED:false}
    email: ${WANDER_DEMO_EMAIL:demo@wander.local}
    password: ${WANDER_DEMO_PASSWORD:demo-traveller}
    sweep-minutes: ${WANDER_DEMO_SWEEP_MINUTES:45}
  # Self-signup, off by default: the default has to be the safe answer for an
  # instance on a public hostname, where an open sign-up form hands this
  # machine's Nominatim, Commons and Open-Meteo budget to whoever finds it.
  # An invitation link still admits its holder either way, so "off" is a closed
  # instance rather than a sealed one.
  registration-enabled: ${WANDER_REGISTRATION_ENABLED:false}
  login:
    # Failed sign-ins remembered per account and per client address; a success
    # clears both. See LoginThrottle — this is the one endpoint an
    # internet-facing instance gets probed on without being singled out.
    max-failures-per-email: ${WANDER_LOGIN_MAX_FAILURES:10}
    max-failures-per-address: ${WANDER_LOGIN_MAX_FAILURES_PER_ADDRESS:40}
    window-minutes: ${WANDER_LOGIN_WINDOW_MINUTES:15}
    # Accounts one address may create inside the same window. Counted whether
    # the sign-up works or not: registering is anonymous, spends a bcrypt round
    # every time and leaves a row behind when it succeeds. The browser suite
    # registers every one of its accounts from a single address, so an instance
    # you point `npm run e2e` at needs this raised.
    max-registrations-per-address: ${WANDER_REGISTRATION_MAX_PER_ADDRESS:20}
  # How much of this instance's *upstream* budget one signed-in person may
  # spend. Three endpoints reach somebody else's donated service on a caller's
  # behalf, and RateGate — which spaces what wander sends out — does not help:
  # it parks the request thread, so one heavy caller queues everybody else's
  # searches behind their own. Keyed by user id, which needs no proxy to be
  # configured correctly to mean anything. See UpstreamQuota.
  quota:
    searches-per-window: ${WANDER_QUOTA_SEARCHES:120}
    enrichments-per-window: ${WANDER_QUOTA_ENRICHMENTS:60}
    forecasts-per-window: ${WANDER_QUOTA_FORECASTS:60}
    # A rate for the expense form's preview. The tightest, and it can afford to
    # be: one lookup per foreign expense somebody is typing, over a cache that
    # never expires.
    rates-per-window: ${WANDER_QUOTA_RATES:40}
    # Auto-sorting a day. One click is one matrix, which is the heaviest
    # question this application asks anything, and it cannot be cached.
    routes-per-window: ${WANDER_QUOTA_ROUTES:40}
    window-minutes: ${WANDER_QUOTA_WINDOW_MINUTES:5}
  # The Content-Security-Policy header, assembled from the map settings below
  # rather than written out, so an operator running their own tiles does not get
  # a blank map. Set report-only=true to load the page and read the violations
  # instead of being refused by them; extra-sources appends space-separated
  # origins to connect-src, img-src and font-src.
  csp:
    enabled: ${WANDER_CSP_ENABLED:true}
    report-only: ${WANDER_CSP_REPORT_ONLY:false}
    extra-sources: ${WANDER_CSP_EXTRA_SOURCES:}
  # What a new trip's money is counted in when its creator does not say. Fixed
  # per trip once created, so this only ever affects the next one.
  currency: ${WANDER_CURRENCY:EUR}
  geocoding:
    # Place search proxies to Nominatim. Set enabled=false on an instance with
    # no outbound network access; point base-url at your own Nominatim if you
    # expect real traffic, and then raise min-interval-millis' budget with it.
    enabled: ${WANDER_GEOCODING_ENABLED:true}
    base-url: ${WANDER_GEOCODING_URL:https://nominatim.openstreetmap.org}
    # Sent in the User-Agent. The public instance's policy asks for a way to
    # reach the operator before it has to block them.
    contact-email: ${WANDER_GEOCODING_CONTACT:}
    # Fallback for a caller that sends no Accept-Language. Browsers always do,
    # so this mostly covers scripts and curl. Never blank: a geocoder with no
    # preference answers in the place's own language, and a search for Kyoto
    # then comes back as 京都.
    language: ${WANDER_GEOCODING_LANGUAGE:en}
    min-interval-millis: ${WANDER_GEOCODING_MIN_INTERVAL_MS:1000}
  enrichment:
    # Descriptions, facts, hours and photos for a place, from OpenStreetMap,
    # Wikidata, Wikipedia and Commons. Off means the map popup shows nothing but
    # the place itself, which is also what an instance with no outbound network
    # gets. Everything fetched is stored and shared by every trip on the instance,
    # so the rate below is about first sight of a place, not steady traffic.
    enabled: ${WANDER_ENRICHMENT_ENABLED:true}
    cache-days: ${WANDER_ENRICHMENT_CACHE_DAYS:30}
    photo-count: ${WANDER_ENRICHMENT_PHOTO_COUNT:4}
  weather:
    # The forecast on a day card, from Open-Meteo — no API key, so a self-hoster
    # does not have to register an account to use it. The free tier is
    # **non-commercial** and the data is CC BY 4.0, which is why the attribution
    # below is sent to the client and shown wherever a forecast is. An operator
    # running this commercially needs their own arrangement and their own URL.
    #
    # A forecast exists about sixteen days out. Days past that show nothing at
    # all rather than a placeholder — for a trip in nine months there is nothing
    # to show, and pretending otherwise is worse than an empty space.
    enabled: ${WANDER_WEATHER_ENABLED:true}
    base-url: ${WANDER_WEATHER_URL:https://api.open-meteo.com}
    horizon-days: ${WANDER_WEATHER_HORIZON_DAYS:16}
    # Minutes, not days: a forecast changes through the day, unlike an enrichment.
    cache-minutes: ${WANDER_WEATHER_CACHE_MINUTES:180}
    attribution: ${WANDER_WEATHER_ATTRIBUTION:Weather data by Open-Meteo.com (CC BY 4.0)}
    attribution-url: ${WANDER_WEATHER_ATTRIBUTION_URL:https://open-meteo.com/}
  routing:
    # Auto-sorting a day by how long it takes to get between its stops, over
    # OSRM. **Off by default, and this is the one upstream where that is not
    # caution.** The others have a public service anybody may politely use;
    # routing has none — the OSRM project's demo server is a demo, not capacity
    # to build on. What a self-hoster does have is that OSRM is easy to run:
    #
    #   docker run -p 5000:5000 osrm/osrm-backend osrm-routed /data/region.osrm
    #
    # over an extract of wherever they are going. Point base-url at that and
    # switch this on. The profile (driving, walking, cycling) is a path segment,
    # so one URL serves all three on an engine that has all three graphs; a
    # single-graph osrm-backend ignores it and answers the same for each.
    enabled: ${WANDER_ROUTING_ENABLED:false}
    base-url: ${WANDER_ROUTING_URL:http://localhost:5000}
    # The most stops one day may be sorted with. The matrix is n², and a day
    # with more than a dozen stops is not a day anybody is having.
    max-stops: ${WANDER_ROUTING_MAX_STOPS:12}
    attribution: ${WANDER_ROUTING_ATTRIBUTION:Routing by OSRM · map data © OpenStreetMap contributors}
    attribution-url: ${WANDER_ROUTING_ATTRIBUTION_URL:https://project-osrm.org/}
    # Gap between outbound calls. 200ms is written for an engine in the next
    # rack, which is what base-url points at by default. It is a setting because
    # a shared engine's limit is somebody else's to set and is usually far
    # lower: FOSSGIS's public OSRM allows one request a second, so an instance
    # pointed there must raise this to 1000 or it is over the limit by five
    # times. Nothing would say so — the gate still gates, the requests still
    # answer, and the blocking arrives later and from outside.
    min-interval-millis: ${WANDER_ROUTING_MIN_INTERVAL_MS:200}
  fx:
    # Exchange rates, for an expense paid in something other than the trip's
    # currency. Frankfurter — no API key, for the same reason Open-Meteo was
    # chosen: a self-hoster should not have to open an account with a foreign
    # exchange vendor to record a dinner in yen. It is MIT-licensed and ships a
    # container, so `url` below can point at your own copy.
    #
    # Off turns off the **lookup**, not the feature. A foreign currency can still
    # be recorded with a rate somebody types, which is the only thing that works
    # on an instance with no outbound network — and is often the better number
    # anyway, since a card statement knows what was really charged.
    #
    # Whatever the rate, it is stored on the expense and **frozen**: the money
    # left the account at the rate of the day, and editing the description later
    # must not move anybody's balance.
    enabled: ${WANDER_FX_ENABLED:true}
    base-url: ${WANDER_FX_URL:https://api.frankfurter.dev}
    # How long the supported-currency listing is held. A day: coverage moves when
    # a central bank joins or leaves, and the list is wanted on every page that
    # draws a currency picker.
    currency-cache-hours: ${WANDER_FX_CURRENCY_CACHE_HOURS:24}
    # Not required by the upstream's licence, and carried for the reason the
    # weather credit is: a number somebody is asked to trust should say where it
    # came from, and an operator pointing this elsewhere needs the credit to
    # follow the data.
    attribution: ${WANDER_FX_ATTRIBUTION:Exchange rates via Frankfurter}
    attribution-url: ${WANDER_FX_ATTRIBUTION_URL:https://frankfurter.dev/}
  booking-import:
    # Reading a booking out of a confirmation file: an email, a PDF, an HTML
    # page, a calendar attachment or an Apple Wallet pass.
    #
    # Two readers, and only one of them is optional. The iCalendar reader is
    # pure Java and always present. The document extractor is KItinerary, a
    # binary in the image carrying 349 provider formats plus schema.org markup
    # and boarding-pass barcodes — probed at startup, so an image built without
    # it reports itself as calendar-only rather than failing. Switch this off
    # entirely if you would rather nothing on this instance parsed an upload.
    #
    # Importing never writes: it answers with drafts and the user saves them
    # through the ordinary booking form.
    enabled: ${WANDER_IMPORT_ENABLED:true}
    # Only for an installation the startup probe does not know about.
    extractor-path: ${WANDER_IMPORT_EXTRACTOR_PATH:}
    # Extra extractor scripts, handed to the extractor as its additional search
    # path. This project's image sets it to /app/extractors, which carries fixes
    # to upstream extractors — not parsers of our own; extractors/README.md sets
    # the bar. Blank loads the 349 built in and nothing else.
    extractor-search-path: ${WANDER_IMPORT_EXTRACTOR_SEARCH_PATH:}
    # A cap on a wedged process, not a deadline: a tenth of a second is typical.
    timeout-seconds: ${WANDER_IMPORT_TIMEOUT_SECONDS:30}
    max-output-bytes: ${WANDER_IMPORT_MAX_OUTPUT_BYTES:4194304}
  map:
    # Tiles are fetched by the browser, so this is the one thing here that is
    # not proxied. Point it at your own tile server if you would rather your
    # users' browsers did not talk to openstreetmap.org — and keep the
    # attribution in step with whatever you point it at.
    enabled: ${WANDER_MAP_ENABLED:true}
    style-url: ${WANDER_MAP_STYLE_URL:https://tiles.openfreemap.org/styles/liberty}
    dark-style-url: ${WANDER_MAP_DARK_STYLE_URL:https://tiles.openfreemap.org/styles/dark}
    # The raster fallback, used only when style-url is blank.
    tile-url: ${WANDER_MAP_TILE_URL:https://tile.openstreetmap.org/{z}/{x}/{y}.png}
    attribution: ${WANDER_MAP_ATTRIBUTION:OpenFreeMap · OpenMapTiles · © OpenStreetMap contributors}
  admin:
    email: ${WANDER_ADMIN_EMAIL:}
    password: ${WANDER_ADMIN_PASSWORD:}

logging:
  level:
    com.wander: ${WANDER_LOG_LEVEL:INFO}
