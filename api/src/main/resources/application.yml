spring:
  application:
    name: wander

  datasource:
    url: ${WANDER_DB_URL:jdbc:postgresql://localhost:5432/wander}
    username: ${WANDER_DB_USER:wander}
    password: ${WANDER_DB_PASSWORD:wander}

  jpa:
    # Flyway owns the schema. `validate` means a drifted entity fails at boot
    # instead of silently altering tables under a running instance.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  # An SPA route like /trips/7 is not a static file; the SPA fallback below
  # turns it back into index.html.
  web:
    resources:
      add-mappings: true

  threads:
    virtual:
      # Virtual threads make plain blocking JDBC code cheap to scale, which is
      # why none of this project needs to be reactive.
      enabled: true

server:
  port: ${WANDER_PORT:8080}
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        # Set WANDER_COOKIE_SECURE=true behind TLS (i.e. always, in production).
        secure: ${WANDER_COOKIE_SECURE:false}
      timeout: 30d
  forward-headers-strategy: framework

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  # Without these, springdoc documents every response as `*/*` (no controller
  # declares `produces`), and ng-openapi-gen then generates a client that asks
  # for a Blob instead of JSON. The server is fine either way — curl sees proper
  # JSON — so this only ever shows up in the browser, as a body that arrives
  # unparsed.
  default-produces-media-type: application/json
  default-consumes-media-type: application/json

wander:
  version: 0.1.0
  registration-enabled: ${WANDER_REGISTRATION_ENABLED:true}
  geocoding:
    # Place search proxies to Nominatim. Set enabled=false on an instance with
    # no outbound network access; point base-url at your own Nominatim if you
    # expect real traffic, and then raise min-interval-millis' budget with it.
    enabled: ${WANDER_GEOCODING_ENABLED:true}
    base-url: ${WANDER_GEOCODING_URL:https://nominatim.openstreetmap.org}
    # Sent in the User-Agent. The public instance's policy asks for a way to
    # reach the operator before it has to block them.
    contact-email: ${WANDER_GEOCODING_CONTACT:}
    min-interval-millis: ${WANDER_GEOCODING_MIN_INTERVAL_MS:1000}
  map:
    # Tiles are fetched by the browser, so this is the one thing here that is
    # not proxied. Point it at your own tile server if you would rather your
    # users' browsers did not talk to openstreetmap.org — and keep the
    # attribution in step with whatever you point it at.
    enabled: ${WANDER_MAP_ENABLED:true}
    tile-url: ${WANDER_MAP_TILE_URL:https://tile.openstreetmap.org/{z}/{x}/{y}.png}
    attribution: ${WANDER_MAP_ATTRIBUTION:© OpenStreetMap contributors}
  admin:
    email: ${WANDER_ADMIN_EMAIL:}
    password: ${WANDER_ADMIN_PASSWORD:}

logging:
  level:
    com.wander: ${WANDER_LOG_LEVEL:INFO}
