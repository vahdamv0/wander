# Three jobs, all gates. Nothing here is allowed to be "warn" — see README.
stages: [verify, package]

variables:
  # Gradle needs a writable home inside the container, and caching it makes the
  # second pipeline much faster than the first.
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .gradle/wrapper
    - .gradle/caches
    - web/node_modules

test:
  stage: verify
  image: eclipse-temurin:21-jdk
  services:
    # Testcontainers needs a Docker daemon to start Postgres.
    - name: docker:27-dind
      alias: docker
  variables:
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_TLS_CERTDIR: ""
    TESTCONTAINERS_HOST_OVERRIDE: "docker"
  script:
    - ./gradlew build
  artifacts:
    when: always
    reports:
      junit: api/build/test-results/test/TEST-*.xml
    paths:
      - api/build/openapi.json
    expire_in: 1 week

# The generated client is committed, so it can drift from the Java contract.
# This job makes drift a red pipeline instead of a silent inconsistency.
api-client-drift:
  stage: verify
  image: eclipse-temurin:21-jdk
  services:
    - name: docker:27-dind
      alias: docker
  variables:
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_TLS_CERTDIR: ""
    TESTCONTAINERS_HOST_OVERRIDE: "docker"
  script:
    # The spec is written by OpenApiSpecExportTest.
    - ./gradlew :api:test
    # :web:apiGen, not a bare npx: this image is a JDK with no node on PATH, and
    # the Gradle task runs the generator through the plugin's downloaded Node.
    #
    # Checksums rather than `git diff`: this image has no git either — GitLab
    # clones with the runner's helper container, so the job image never needs it.
    # It also fixes a way this check could lie. `if ! git diff --quiet` treats
    # "the command could not run" exactly like "the files differ", so a missing
    # binary exited 127, inverted to true, and printed "the client is out of
    # date" about a diff it had never managed to look at.
    - find web/src/app/api -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/api-client.before
    # --rerun, or this check cannot fail. apiGen declares the spec as its input
    # and the client as its output, so Gradle calls it UP-TO-DATE and skips it —
    # and the comparison then holds the committed files up against themselves and
    # passes no matter how stale they are.
    - ./gradlew :web:apiGen --rerun
    - find web/src/app/api -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/api-client.after
    - |
      # Explicit exit codes, not `if ! diff`: diff answers 0 for same, 1 for
      # different and 2 for "I could not do this", and the third must not be
      # reported as drift.
      diff -u /tmp/api-client.before /tmp/api-client.after > /tmp/api-client.diff
      case $? in
        0) echo "The committed API client matches the spec." ;;
        1)
          echo "The committed API client is out of date."
          echo "Run './gradlew :api:test :web:apiGen' and commit web/src/app/api."
          echo
          cat /tmp/api-client.diff
          exit 1
          ;;
        *)
          echo "The drift check could not run. This is a CI fault, not drift."
          exit 2
          ;;
      esac

# NOT named `image`: that is a reserved top-level keyword, so a job called it is
# read as the global image definition — a map with no `name:` — and the whole
# pipeline is rejected with "image name should be a string" before any job runs.
container-image:
  stage: package
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: ""
  script:
    - docker build -t "wander:$CI_COMMIT_SHORT_SHA" .
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
