# Three jobs, all gates. Nothing here is allowed to be "warn" — see README.
stages: [verify, package]

variables:
  # Gradle needs a writable home inside the container, and caching it makes the
  # second pipeline much faster than the first.
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .gradle/wrapper
    - web/node_modules

test:
  stage: verify
  image: eclipse-temurin:21-jdk
  services:
    # Testcontainers needs a Docker daemon to start Postgres.
    - name: docker:27-dind
      alias: docker
  variables:
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_TLS_CERTDIR: ""
    TESTCONTAINERS_HOST_OVERRIDE: "docker"
  script:
    - ./gradlew build
  artifacts:
    when: always
    reports:
      junit: api/build/test-results/test/TEST-*.xml
    paths:
      - api/build/openapi.json
    expire_in: 1 week

# The generated client is committed, so it can drift from the Java contract.
# This job makes drift a red pipeline instead of a silent inconsistency.
api-client-drift:
  stage: verify
  image: eclipse-temurin:21-jdk
  services:
    - name: docker:27-dind
      alias: docker
  variables:
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_TLS_CERTDIR: ""
    TESTCONTAINERS_HOST_OVERRIDE: "docker"
  script:
    # The spec is written by OpenApiSpecExportTest.
    - ./gradlew :api:test
    # :web:apiGen, not a bare npx: this image is a JDK with no node on PATH, and
    # the Gradle task runs the generator through the plugin's downloaded Node.
    #
    # Checksums rather than `git diff`: this image has no git either — GitLab
    # clones with the runner's helper container, so the job image never needs it.
    # It also fixes a way this check could lie. `if ! git diff --quiet` treats
    # "the command could not run" exactly like "the files differ", so a missing
    # binary exited 127, inverted to true, and printed "the client is out of
    # date" about a diff it had never managed to look at.
    - find web/src/app/api -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/api-client.before
    # --rerun, or this check cannot fail. apiGen declares the spec as its input
    # and the client as its output, so Gradle calls it UP-TO-DATE and skips it —
    # and the comparison then holds the committed files up against themselves and
    # passes no matter how stale they are.
    - ./gradlew :web:apiGen --rerun
    - find web/src/app/api -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/api-client.after
    - |
      # Explicit exit codes, not `if ! diff`: diff answers 0 for same, 1 for
      # different and 2 for "I could not do this", and the third must not be
      # reported as drift.
      diff -u /tmp/api-client.before /tmp/api-client.after > /tmp/api-client.diff
      case $? in
        0) echo "The committed API client matches the spec." ;;
        1)
          echo "The committed API client is out of date."
          echo "Run './gradlew :api:test :web:apiGen' and commit web/src/app/api."
          echo
          cat /tmp/api-client.diff
          exit 1
          ;;
        *)
          echo "The drift check could not run. This is a CI fault, not drift."
          exit 2
          ;;
      esac

# NOT named `image`: that is a reserved top-level keyword, so a job called it is
# read as the global image definition — a map with no `name:` — and the whole
# pipeline is rejected with "image name should be a string" before any job runs.
container-image:
  stage: package
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: ""
  script:
    # $CI_REGISTRY_* are injected by GitLab; the password is a job-scoped token
    # that expires with the job, so there is no secret to store here.
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    # Two architectures, because the runners are x86 and the machine this is
    # deployed to is an Ampere box. An amd64-only image pulls perfectly onto
    # arm64 and then dies with `exec format error` — the failure arrives at
    # `docker compose up`, on the server, not here.
    #
    # It costs almost nothing: the Dockerfile's build stage is pinned to
    # $BUILDPLATFORM and produces an architecture-neutral jar, so only the tiny
    # runtime stage (a user, a few COPYs) is emulated per architecture.
    - docker run --privileged --rm tonistiigi/binfmt --install arm64
    # The default "docker" driver cannot build multi-platform; a container
    # builder can.
    - docker buildx create --name wander --driver docker-container --use
    - docker buildx inspect --bootstrap
    # What this image calls itself. A tag pipeline is a release, so the version
    # is the tag with any leading "v" removed; anything else is honestly "dev",
    # and the commit is what identifies it. Both are baked in as build arguments
    # and come back out through /api/config.
    #
    # The version argument is added only when there *is* a tag: passing it empty
    # would set the environment variable to an empty string, and Spring reads a
    # set-but-empty variable as a value rather than falling back to its default.
    - |
      TAGS="-t $CI_REGISTRY_IMAGE:latest"
      VERSION_ARG=""
      if [ -n "$CI_COMMIT_TAG" ]; then
        TAGS="$TAGS -t $CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
        VERSION_ARG="--build-arg WANDER_VERSION=${CI_COMMIT_TAG#v}"
        IMAGE_REF="$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
      else
        TAGS="$TAGS -t $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
        IMAGE_REF="$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
      fi
      echo "Building $IMAGE_REF"
      docker buildx build \
        --platform linux/amd64,linux/arm64 \
        --provenance=false \
        --sbom=false \
        --build-arg WANDER_BUILD_REF="$CI_COMMIT_SHORT_SHA" \
        $VERSION_ARG \
        $TAGS \
        --push .
      echo "$IMAGE_REF" > image-ref.txt
    # The image carries its own deployment bundle. Proving it here means a
    # broken `bundle` is a red pipeline rather than a discovery made on a server
    # with no source checkout to fall back on.
    - IMAGE_REF=$(cat image-ref.txt)
    - docker pull "$IMAGE_REF"
    - mkdir -p /tmp/bundle
    - docker run --rm "$IMAGE_REF" bundle | tar x -C /tmp/bundle
    - test -f /tmp/bundle/compose.yaml
    - test -f /tmp/bundle/Caddyfile
    - test -f /tmp/bundle/.env.example
    - test -x /tmp/bundle/update.sh
    - test -f /tmp/bundle/backup/backup.sh
  rules:
    # A tag is a release: it publishes :<tag> alongside :latest, and it is the
    # only thing that gives the image a version rather than "dev".
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
