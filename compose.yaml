# Production-shaped Compose file: one app container, one database, one volume.
#
#   cp .env.example .env   # then edit POSTGRES_PASSWORD
#   docker compose up -d
#
# The admin password is printed once to the log on first boot unless you set
# WANDER_ADMIN_* in .env:  docker compose logs wander

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: wander
      POSTGRES_USER: wander
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      # The app waits for this: Flyway runs at boot and a database that is not
      # accepting connections yet would fail the migration, not retry it.
      test: ["CMD-SHELL", "pg_isready -U wander -d wander"]
      interval: 5s
      timeout: 3s
      retries: 20

  wander:
    # `build: .` for a working copy; a deployment sets WANDER_IMAGE to the
    # published image and never builds. Both names resolve to the same thing —
    # the pull path just skips the compiler.
    build: .
    image: ${WANDER_IMAGE:-wander:local}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      WANDER_DB_URL: jdbc:postgresql://db:5432/wander
      WANDER_DB_USER: wander
      WANDER_DB_PASSWORD: ${POSTGRES_PASSWORD}
      WANDER_ADMIN_EMAIL: ${WANDER_ADMIN_EMAIL:-}
      WANDER_ADMIN_PASSWORD: ${WANDER_ADMIN_PASSWORD:-}
      # Off by default. An invitation link still admits its holder, so this is a
      # closed instance rather than a sealed one — see .env.example.
      WANDER_REGISTRATION_ENABLED: ${WANDER_REGISTRATION_ENABLED:-false}
      # The source link the interface offers. Change it if you modify wander:
      # AGPL-3.0 section 13 owes your users the source you are actually running.
      WANDER_SOURCE_URL: ${WANDER_SOURCE_URL:-https://gitlab.com/vm83043/wander}
      # A seeded example trip and a published read-only account. Off unless this
      # is a demo instance; see .env.example.
      WANDER_DEMO_ENABLED: ${WANDER_DEMO_ENABLED:-false}
      WANDER_DEMO_EMAIL: ${WANDER_DEMO_EMAIL:-demo@wander.local}
      WANDER_DEMO_PASSWORD: ${WANDER_DEMO_PASSWORD:-demo-traveller}
      WANDER_DEMO_SWEEP_MINUTES: ${WANDER_DEMO_SWEEP_MINUTES:-45}
      # Guessing a password, and creating accounts. These were documented in
      # .env.example before they were passed through here, so setting them had
      # no effect on the container — the application's own defaults are the same
      # numbers, which is why nothing looked wrong.
      WANDER_LOGIN_MAX_FAILURES: ${WANDER_LOGIN_MAX_FAILURES:-10}
      WANDER_LOGIN_MAX_FAILURES_PER_ADDRESS: ${WANDER_LOGIN_MAX_FAILURES_PER_ADDRESS:-40}
      WANDER_LOGIN_WINDOW_MINUTES: ${WANDER_LOGIN_WINDOW_MINUTES:-15}
      WANDER_REGISTRATION_MAX_PER_ADDRESS: ${WANDER_REGISTRATION_MAX_PER_ADDRESS:-20}
      # How much of this instance's upstream budget one signed-in person may
      # spend. See .env.example.
      WANDER_QUOTA_SEARCHES: ${WANDER_QUOTA_SEARCHES:-120}
      WANDER_QUOTA_ENRICHMENTS: ${WANDER_QUOTA_ENRICHMENTS:-60}
      WANDER_QUOTA_FORECASTS: ${WANDER_QUOTA_FORECASTS:-60}
      WANDER_QUOTA_WINDOW_MINUTES: ${WANDER_QUOTA_WINDOW_MINUTES:-5}
      # The Content-Security-Policy, built from the map settings below.
      WANDER_CSP_ENABLED: ${WANDER_CSP_ENABLED:-true}
      WANDER_CSP_REPORT_ONLY: ${WANDER_CSP_REPORT_ONLY:-false}
      WANDER_CSP_EXTRA_SOURCES: ${WANDER_CSP_EXTRA_SOURCES:-}
      WANDER_GEOCODING_ENABLED: ${WANDER_GEOCODING_ENABLED:-true}
      WANDER_GEOCODING_URL: ${WANDER_GEOCODING_URL:-https://nominatim.openstreetmap.org}
      WANDER_GEOCODING_CONTACT: ${WANDER_GEOCODING_CONTACT:-}
      WANDER_GEOCODING_LANGUAGE: ${WANDER_GEOCODING_LANGUAGE:-en}
      WANDER_MAP_ENABLED: ${WANDER_MAP_ENABLED:-true}
      # A MapLibre vector style, which is what lets the map be labelled in the
      # reader's language. Blank falls back to the raster tile URL below.
      WANDER_MAP_STYLE_URL: ${WANDER_MAP_STYLE_URL:-https://tiles.openfreemap.org/styles/liberty}
      WANDER_MAP_DARK_STYLE_URL: ${WANDER_MAP_DARK_STYLE_URL:-https://tiles.openfreemap.org/styles/dark}
      WANDER_MAP_TILE_URL: ${WANDER_MAP_TILE_URL:-https://tile.openstreetmap.org/{z}/{x}/{y}.png}
      WANDER_MAP_ATTRIBUTION: ${WANDER_MAP_ATTRIBUTION:-OpenFreeMap · OpenMapTiles · © OpenStreetMap contributors}
      WANDER_COOKIE_SECURE: ${WANDER_COOKIE_SECURE:-false}
      WANDER_LOG_LEVEL: ${WANDER_LOG_LEVEL:-INFO}
    ports:
      # Bound to loopback by default: the proxy reaches this over the compose
      # network, not through a published port, so exposing 8080 on a server would
      # only offer a way around TLS and the secure cookie. Locally it stays
      # http://localhost:8080, which is what the browser suite drives.
      # Set WANDER_BIND=0.0.0.0 to publish it anyway.
      - "${WANDER_BIND:-127.0.0.1}:${WANDER_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  # The only thing standing between a dead disk and losing every trip, expense
  # and booking reference. Same image as the database on purpose: pg_dump will
  # not dump a server newer than itself.
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: wander
      PGDATABASE: wander
      PGPASSWORD: ${POSTGRES_PASSWORD}
      WANDER_BACKUP_INTERVAL_SECONDS: ${WANDER_BACKUP_INTERVAL_SECONDS:-86400}
      WANDER_BACKUP_KEEP: ${WANDER_BACKUP_KEEP:-30}
    volumes:
      - ./backup/backup.sh:/usr/local/bin/backup.sh:ro
      # A host directory, not a named volume, and that is the point: `docker
      # compose down -v` wipes named volumes, and the backups are exactly what
      # you want to survive somebody typing that.
      - ${WANDER_BACKUP_DIR:-./backups}:/backups
    entrypoint: ["/bin/sh", "/usr/local/bin/backup.sh"]

  # TLS terminates here. See Caddyfile: WANDER_SITE_ADDRESS decides HTTP or
  # HTTPS on its own, and nothing else in the stack changes between the two.
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - wander
    environment:
      WANDER_SITE_ADDRESS: ${WANDER_SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and ACME account keys. This volume is not optional: without
      # it every restart asks Let's Encrypt for a fresh certificate, and their
      # rate limit is five per hostname per week.
      - caddy-data:/data
      - caddy-config:/config
    ports:
      - "${WANDER_HTTP_PORT:-80}:80"
      - "${WANDER_HTTPS_PORT:-443}:443"
      # HTTP/3, which Caddy serves on the same port over UDP.
      - "${WANDER_HTTPS_PORT:-443}:443/udp"

volumes:
  db-data:
  caddy-data:
  caddy-config:
