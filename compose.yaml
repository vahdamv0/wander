# Production-shaped Compose file: one app container, one database, one volume.
#
#   cp .env.example .env   # then edit POSTGRES_PASSWORD
#   docker compose up -d
#
# The admin password is printed once to the log on first boot unless you set
# WANDER_ADMIN_* in .env:  docker compose logs wander

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: wander
      POSTGRES_USER: wander
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      # The app waits for this: Flyway runs at boot and a database that is not
      # accepting connections yet would fail the migration, not retry it.
      test: ["CMD-SHELL", "pg_isready -U wander -d wander"]
      interval: 5s
      timeout: 3s
      retries: 20

  wander:
    # `build: .` for a working copy; a deployment sets WANDER_IMAGE to the
    # published image and never builds. Both names resolve to the same thing —
    # the pull path just skips the compiler.
    build: .
    image: ${WANDER_IMAGE:-wander:local}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      WANDER_DB_URL: jdbc:postgresql://db:5432/wander
      WANDER_DB_USER: wander
      WANDER_DB_PASSWORD: ${POSTGRES_PASSWORD}
      WANDER_ADMIN_EMAIL: ${WANDER_ADMIN_EMAIL:-}
      WANDER_ADMIN_PASSWORD: ${WANDER_ADMIN_PASSWORD:-}
      # Off by default. An invitation link still admits its holder, so this is a
      # closed instance rather than a sealed one — see .env.example.
      WANDER_REGISTRATION_ENABLED: ${WANDER_REGISTRATION_ENABLED:-false}
      # The source link the interface offers. Change it if you modify wander:
      # AGPL-3.0 section 13 owes your users the source you are actually running.
      #
      # No default restated here. A null value is Compose's pass-through: the
      # value is taken from .env or the shell if it is set there, and if it is
      # not, the variable reaches the container *absent* rather than empty — so
      # the application's own default in application.yml applies. Writing
      # `${WANDER_SOURCE_URL:-}` instead would set it to an empty string, and
      # Spring reads set-but-empty as a value, which would blank the licence
      # link on every deployment that had not set one.
      WANDER_SOURCE_URL:
      # Sending mail — the self-service "Forgot password?" route. Off unless a
      # relay is configured, and the whole block is pass-through rather than
      # restated defaults: unset variables reach the container absent, so
      # application.yml decides. Any provider that speaks SMTP works; there is
      # deliberately no vendor named anywhere in this project.
      WANDER_MAIL_ENABLED:
      WANDER_MAIL_FROM:
      WANDER_MAIL_FROM_NAME:
      WANDER_MAIL_BASE_URL:
      WANDER_MAIL_RESET_EXPIRES_MINUTES:
      WANDER_MAIL_MAX_REQUESTS_PER_ADDRESS:
      WANDER_SMTP_HOST:
      WANDER_SMTP_PORT:
      WANDER_SMTP_USER:
      WANDER_SMTP_PASSWORD:
      WANDER_SMTP_AUTH:
      WANDER_SMTP_STARTTLS:
      # Reading a booking out of an uploaded confirmation. See .env.example.
      # Pass-through, like the mail block: unset variables reach the container
      # absent, so application.yml decides.
      #
      # **WANDER_IMPORT_EXTRACTOR_SEARCH_PATH is deliberately not in this list**,
      # and that is the opposite of the WANDER_SOURCE_URL reasoning rather than an
      # oversight. A null entry here does not merely decline to set a variable —
      # it *unsets* one the image had set, and the Dockerfile sets this one to
      # /app/extractors, where the fixes to KItinerary's own extractors live. So
      # listing it removed them, silently: no failure, no log line, just a
      # confirmation that stopped importing. Verified with `env` inside the
      # container, because nothing else would have shown it. Overriding the path
      # means mounting your own scripts, which needs a volume and an edit here
      # anyway.
      WANDER_IMPORT_ENABLED:
      WANDER_IMPORT_MAX_FILE_SIZE:
      WANDER_IMPORT_MAX_REQUEST_SIZE:
      WANDER_IMPORT_EXTRACTOR_PATH:
      WANDER_IMPORT_TIMEOUT_SECONDS:
      WANDER_IMPORT_MAX_OUTPUT_BYTES:
      # A seeded example trip and a published read-only account. Off unless this
      # is a demo instance; see .env.example.
      WANDER_DEMO_ENABLED: ${WANDER_DEMO_ENABLED:-false}
      WANDER_DEMO_EMAIL: ${WANDER_DEMO_EMAIL:-demo@wander.local}
      WANDER_DEMO_PASSWORD: ${WANDER_DEMO_PASSWORD:-demo-traveller}
      WANDER_DEMO_SWEEP_MINUTES: ${WANDER_DEMO_SWEEP_MINUTES:-45}
      # Guessing a password, and creating accounts. These were documented in
      # .env.example before they were passed through here, so setting them had
      # no effect on the container — the application's own defaults are the same
      # numbers, which is why nothing looked wrong.
      WANDER_LOGIN_MAX_FAILURES: ${WANDER_LOGIN_MAX_FAILURES:-10}
      WANDER_LOGIN_MAX_FAILURES_PER_ADDRESS: ${WANDER_LOGIN_MAX_FAILURES_PER_ADDRESS:-40}
      WANDER_LOGIN_WINDOW_MINUTES: ${WANDER_LOGIN_WINDOW_MINUTES:-15}
      WANDER_REGISTRATION_MAX_PER_ADDRESS: ${WANDER_REGISTRATION_MAX_PER_ADDRESS:-20}
      # How much of this instance's upstream budget one signed-in person may
      # spend. See .env.example.
      WANDER_QUOTA_SEARCHES: ${WANDER_QUOTA_SEARCHES:-120}
      WANDER_QUOTA_ENRICHMENTS: ${WANDER_QUOTA_ENRICHMENTS:-60}
      WANDER_QUOTA_FORECASTS: ${WANDER_QUOTA_FORECASTS:-60}
      WANDER_QUOTA_RATES: ${WANDER_QUOTA_RATES:-40}
      WANDER_QUOTA_ROUTES: ${WANDER_QUOTA_ROUTES:-40}
      WANDER_QUOTA_WINDOW_MINUTES: ${WANDER_QUOTA_WINDOW_MINUTES:-5}
      # The Content-Security-Policy, built from the map settings below.
      WANDER_CSP_ENABLED: ${WANDER_CSP_ENABLED:-true}
      WANDER_CSP_REPORT_ONLY: ${WANDER_CSP_REPORT_ONLY:-false}
      WANDER_CSP_EXTRA_SOURCES: ${WANDER_CSP_EXTRA_SOURCES:-}
      WANDER_GEOCODING_ENABLED: ${WANDER_GEOCODING_ENABLED:-true}
      WANDER_GEOCODING_URL: ${WANDER_GEOCODING_URL:-https://nominatim.openstreetmap.org}
      WANDER_GEOCODING_CONTACT: ${WANDER_GEOCODING_CONTACT:-}
      WANDER_GEOCODING_LANGUAGE: ${WANDER_GEOCODING_LANGUAGE:-en}
      # Exchange rates for an expense paid in another currency. Off turns off
      # the lookup, not the feature: a rate can still be typed, which is what an
      # instance with no outbound network does.
      WANDER_FX_ENABLED: ${WANDER_FX_ENABLED:-true}
      WANDER_FX_URL: ${WANDER_FX_URL:-https://api.frankfurter.dev}
      WANDER_FX_ATTRIBUTION: ${WANDER_FX_ATTRIBUTION:-Exchange rates via Frankfurter}
      WANDER_FX_ATTRIBUTION_URL: ${WANDER_FX_ATTRIBUTION_URL:-https://frankfurter.dev/}
      # Sorting a day by route, over OSRM. Off by default and it has to be:
      # there is no public routing service to point at, so this only works once
      # you run one — `docker run -p 5000:5000 osrm/osrm-backend` over an
      # extract of wherever you are going.
      WANDER_ROUTING_ENABLED: ${WANDER_ROUTING_ENABLED:-false}
      WANDER_ROUTING_URL: ${WANDER_ROUTING_URL:-http://localhost:5000}
      WANDER_ROUTING_MAX_STOPS: ${WANDER_ROUTING_MAX_STOPS:-12}
      WANDER_ROUTING_ATTRIBUTION: ${WANDER_ROUTING_ATTRIBUTION:-Routing by OSRM · map data © OpenStreetMap contributors}
      WANDER_ROUTING_ATTRIBUTION_URL: ${WANDER_ROUTING_ATTRIBUTION_URL:-https://project-osrm.org/}
      # One request a second is what a shared OSRM allows; 200ms is for one you
      # run yourself. Passed through here because a value set only in .env
      # reaches nothing — the WANDER_LOGIN_* mistake, and the symptom is the
      # same: no failure, and a limit quietly exceeded.
      WANDER_ROUTING_MIN_INTERVAL_MS: ${WANDER_ROUTING_MIN_INTERVAL_MS:-200}
      WANDER_MAP_ENABLED: ${WANDER_MAP_ENABLED:-true}
      # A MapLibre vector style, which is what lets the map be labelled in the
      # reader's language. Blank falls back to the raster tile URL below.
      WANDER_MAP_STYLE_URL: ${WANDER_MAP_STYLE_URL:-https://tiles.openfreemap.org/styles/liberty}
      WANDER_MAP_DARK_STYLE_URL: ${WANDER_MAP_DARK_STYLE_URL:-https://tiles.openfreemap.org/styles/dark}
      WANDER_MAP_TILE_URL: ${WANDER_MAP_TILE_URL:-https://tile.openstreetmap.org/{z}/{x}/{y}.png}
      WANDER_MAP_ATTRIBUTION: ${WANDER_MAP_ATTRIBUTION:-OpenFreeMap · OpenMapTiles · © OpenStreetMap contributors}
      WANDER_COOKIE_SECURE: ${WANDER_COOKIE_SECURE:-false}
      WANDER_LOG_LEVEL: ${WANDER_LOG_LEVEL:-INFO}
    ports:
      # Bound to loopback by default: the proxy reaches this over the compose
      # network, not through a published port, so exposing 8080 on a server would
      # only offer a way around TLS and the secure cookie. Locally it stays
      # http://localhost:8080, which is what the browser suite drives.
      # Set WANDER_BIND=0.0.0.0 to publish it anyway.
      - "${WANDER_BIND:-127.0.0.1}:${WANDER_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  # The only thing standing between a dead disk and losing every trip, expense
  # and booking reference. Same image as the database on purpose: pg_dump will
  # not dump a server newer than itself.
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: wander
      PGDATABASE: wander
      PGPASSWORD: ${POSTGRES_PASSWORD}
      WANDER_BACKUP_INTERVAL_SECONDS: ${WANDER_BACKUP_INTERVAL_SECONDS:-86400}
      WANDER_BACKUP_KEEP: ${WANDER_BACKUP_KEEP:-30}
    volumes:
      - ./backup/backup.sh:/usr/local/bin/backup.sh:ro
      # A host directory, not a named volume, and that is the point: `docker
      # compose down -v` wipes named volumes, and the backups are exactly what
      # you want to survive somebody typing that.
      - ${WANDER_BACKUP_DIR:-./backups}:/backups
    entrypoint: ["/bin/sh", "/usr/local/bin/backup.sh"]

  # TLS terminates here. See Caddyfile: WANDER_SITE_ADDRESS decides HTTP or
  # HTTPS on its own, and nothing else in the stack changes between the two.
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - wander
    environment:
      WANDER_SITE_ADDRESS: ${WANDER_SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and ACME account keys. This volume is not optional: without
      # it every restart asks Let's Encrypt for a fresh certificate, and their
      # rate limit is five per hostname per week.
      - caddy-data:/data
      - caddy-config:/config
      # The JSON access log, for the monitoring profile to tail. Mounted
      # unconditionally although only Alloy reads it: a volume that appears when
      # a profile is enabled would change the proxy's own definition, and
      # recreating the TLS terminator is not something switching monitoring on
      # should do. Caddy rolls it at 10MiB and keeps 3, so the cost of it being
      # here on an instance that never looks at it is bounded.
      - caddy-logs:/var/log/caddy
    ports:
      - "${WANDER_HTTP_PORT:-80}:80"
      - "${WANDER_HTTPS_PORT:-443}:443"
      # HTTP/3, which Caddy serves on the same port over UDP.
      - "${WANDER_HTTPS_PORT:-443}:443/udp"


  # Monitoring, and the only part of it that runs here.
  #
  # Grafana Cloud hosts the Grafana, the Prometheus and the Loki. It cannot
  # reach this machine, though — Caddy's metrics port and its access log are
  # both on this network, and publishing either so a SaaS could pull from it
  # would be a far worse trade than one more container. So Alloy collects
  # locally and pushes out: metrics for the Caddy dashboard, and the access log
  # with a country looked up per request, which is the half no Prometheus metric
  # can answer.
  #
  # Behind a profile, so `docker compose up -d` starts the four services it
  # always did and this one needs asking for:
  #
  #   docker compose --profile monitoring up -d
  #
  # See .env.example and monitoring/config.alloy.
  alloy:
    image: grafana/alloy:v1.11.3
    profiles: ["monitoring"]
    restart: unless-stopped
    depends_on:
      - proxy
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      # Bound to loopback inside the container, which is the default and is
      # restated because it is load-bearing: Alloy's UI shows the running
      # configuration, and that configuration holds a Grafana Cloud token.
      - --server.http.listen-addr=127.0.0.1:12345
      - /etc/alloy/config.alloy
    environment:
      # The stack's own endpoints and one token, from .env.
      #
      # Restated with empty defaults rather than `${VAR:?...}`, and that is not
      # a style choice: Compose interpolates the *whole file* before it works
      # out which profiles are active, so a required-variable marker here would
      # fail `docker compose up -d` on every instance that has never heard of
      # Grafana Cloud — the four services would stop starting because of a
      # fifth nobody asked for. Left empty, Alloy refuses its own configuration
      # and says which endpoint is missing in `docker compose logs alloy`,
      # which is loud enough and lands on the person who turned this on.
      GRAFANA_CLOUD_PROM_URL: ${GRAFANA_CLOUD_PROM_URL:-}
      GRAFANA_CLOUD_PROM_USER: ${GRAFANA_CLOUD_PROM_USER:-}
      GRAFANA_CLOUD_LOKI_URL: ${GRAFANA_CLOUD_LOKI_URL:-}
      GRAFANA_CLOUD_LOKI_USER: ${GRAFANA_CLOUD_LOKI_USER:-}
      GRAFANA_CLOUD_TOKEN: ${GRAFANA_CLOUD_TOKEN:-}
      # What every series and every log line is tagged with. Defaults to the
      # site address because that is the one thing already distinguishing one
      # wander from another, and a dashboard fed by two instances both calling
      # themselves "wander" is a dashboard adding up two sets of traffic.
      WANDER_MONITORING_INSTANCE: ${WANDER_MONITORING_INSTANCE:-${WANDER_SITE_ADDRESS:-wander}}
    volumes:
      - ./monitoring/config.alloy:/etc/alloy/config.alloy:ro
      # Read-only, and the country database is read from the host rather than
      # baked in: it is refreshed monthly by monitoring/geoip-update.sh and
      # Alloy re-reads it, so keeping it outside the container is what makes the
      # refresh not a rebuild.
      - ./monitoring/geoip:/etc/alloy/geoip:ro
      - caddy-logs:/var/log/caddy:ro
      # Where Alloy remembers how far through the log file it has read. Without
      # it a restart re-sends the whole file, which is double-counted traffic on
      # the dashboard and billed ingest on the way there.
      - alloy-data:/var/lib/alloy/data

volumes:
  db-data:
  caddy-data:
  caddy-config:
  caddy-logs:
  alloy-data:
