<div class="min-h-dvh">
  @if (!online()) {
    <!-- Stale data is shown, so it has to be labelled. This project has refused
         to hide staleness everywhere else; a cache is not the place to start. -->
    <p class="print-hide bg-surface-2 px-4 py-1.5 text-center text-xs text-muted" role="status">
      You're offline — showing what was saved on this device. Changes can't be
      saved until you reconnect.
    </p>
  }
  <!-- print-hide: the shell is screen furniture, and the itinerary printout is
       the one page here designed for paper. -->
  <header
    class="print-hide sticky top-0 z-10 border-b border-border bg-surface/85 backdrop-blur
           supports-[backdrop-filter]:bg-surface/70"
  >
    <div class="mx-auto flex h-14 max-w-5xl items-center gap-3 px-4">
      <a routerLink="/trips" class="flex items-center gap-2 font-semibold tracking-tight">
        <app-brand-mark />
        <span>wander</span>
      </a>

      <nav class="ml-2 flex items-center gap-1 text-sm">
        <a
          routerLink="/trips"
          routerLinkActive="bg-accent-soft text-accent"
          class="rounded-control px-3 py-1.5 font-medium text-muted transition-colors
                 hover:bg-surface-2 hover:text-ink"
        >
          Trips
        </a>
      </nav>

      <div class="ml-auto flex items-center gap-1">
        <app-theme-toggle />

        <div class="mx-1 h-6 w-px bg-border"></div>

        <!-- The avatar is the way to the account page. aria-label rather than an
             sr-only span, for the reason the place rows learned: an sr-only span
             would put the name into the header's text a second time. -->
        <a
          routerLink="/account"
          routerLinkActive="ring-2 ring-accent"
          class="grid size-8 place-items-center rounded-full bg-accent-soft text-xs
                 font-semibold text-accent transition-shadow hover:ring-2 hover:ring-accent"
          [title]="user()?.email"
          [attr.aria-label]="'Account settings for ' + (user()?.displayName ?? '')"
        >
          {{ initials(user()?.displayName) }}
        </a>
        <button type="button" class="btn-ghost text-[0.8125rem]" (click)="signOut()">
          Sign out
        </button>
      </div>
    </div>
  </header>

  <router-outlet />
</div>
