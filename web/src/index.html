<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>wander · collaborative travel planner</title>
  <!-- A crawler sees this file and nothing else. Every route but the sign-in
       form is default-deny, and Angular renders into an empty <app-root>, so
       these tags are the only text in the document that does not require
       JavaScript to appear. Without them a search result is the bare word
       "wander" with no description under it, and a link pasted into a chat
       previews as nothing at all. -->
  <meta name="description" content="A self-hostable, collaborative travel planner: shared itineraries on a map, expenses with splits and balances, packing lists, bookings and offline reading.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="wander">
  <meta property="og:title" content="wander · collaborative travel planner">
  <meta property="og:description" content="A self-hostable, collaborative travel planner: shared itineraries on a map, expenses with splits and balances, packing lists, bookings and offline reading.">
  <!-- Relative on purpose, though the Open Graph specification asks for an
       absolute URL. Nothing operator-configurable is compiled into this app,
       and a hostname here would bake one instance's address into every fork's
       build - the same argument that makes the basemap and the source link
       settings. Crawlers resolve it against the page they found it on. -->
  <meta property="og:image" content="/icon-512.png">
  <meta name="twitter:card" content="summary">
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- SVG first, and browsers that understand it never ask for the .ico. It is
       one file that is sharp at every size and follows the reader's light or
       dark chrome; the .ico is the fallback for Safari before 16. -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/x-icon" href="favicon.ico" sizes="16x16 32x32 48x48 64x64">
  <meta name="theme-color" content="#0f766e" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#04211d" media="(prefers-color-scheme: dark)">
  <!-- The half the service worker did not give us: without a manifest a
       browser has no name, icon or display mode to install with. -->
  <link rel="manifest" href="manifest.webmanifest">
  <!-- iOS reads no manifest icon, and composites transparency onto black. -->
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
</head>
<body>
  <app-root></app-root>
</body>
</html>
